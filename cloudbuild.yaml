# ==============================================================================
# Google Cloud Build Pipeline for Ghazara Platform
# Builds, tests, and deploys container to Google Cloud Run (me-central1)
# ==============================================================================

steps:
  # 1. Build Docker image with multi-stage caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ghazara-website:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ghazara-website:latest'
      - '.'

  # 2. Push image with commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ghazara-website:$COMMIT_SHA']

  # 3. Push image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ghazara-website:latest']

  # 4. Deploy to Google Cloud Run with cold-start & concurrency optimizations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ghazara-website'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ghazara-website:$COMMIT_SHA'
      - '--region'
      - 'me-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--cpu-boost'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/ghazara-website:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ghazara-website:latest'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
