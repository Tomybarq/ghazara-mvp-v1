name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - ghazara_website_initial_build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push
        run: gcloud auth configure-docker

      - name: Build and Push Docker Container
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID || 'ghazara-production' }}/ghazara-website:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID || 'ghazara-production' }}/ghazara-website:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ghazara-website \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID || 'ghazara-production' }}/ghazara-website:${{ github.sha }} \
            --region me-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,PORT=8080,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},JWT_SECRET=${{ secrets.JWT_SECRET }},OAUTH_SERVER_URL=https://accounts.google.com"
