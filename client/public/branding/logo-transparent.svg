<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ghz-iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3B95" />
      <stop offset="100%" stop-color="#8A4E91" />
    </linearGradient>
    <linearGradient id="ghz-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F19844" />
      <stop offset="100%" stop-color="#E6833E" />
    </linearGradient>
    <filter id="ghz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5E3B95" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Monogram Emblem -->
  <g transform="translate(10, 10)" filter="url(#ghz-glow)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#ghz-iris-grad)" />
    <!-- Dynamic Growth Axis Polygon -->
    <path d="M 0 50 L 50 0 L 80 0 L 80 30 L 30 80 L 0 80 Z" fill="url(#ghz-amber-grad)" opacity="0.88" />
    <rect x="3" y="3" width="74" height="74" rx="17" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <!-- Arabic Calligraphic Symbol 'غ' -->
    <text x="40" y="54" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">غ</text>
    <!-- Dot of 'غ' highlighted in Honeyed Amber -->
    <circle cx="53" cy="23" r="5" fill="#F19844" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Typography Block (Bilingual) -->
  <g transform="translate(106, 20)">
    <!-- Primary Arabic Brand Name -->
    <text x="0" y="32" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="30" font-weight="800" fill="currentColor">غــزارة</text>
    
    <!-- Secondary Arabic Activity -->
    <text x="110" y="31" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="15" font-weight="600" fill="#E6833E">للتجارة والتسويق</text>
    
    <!-- English Subtitle & Descriptor -->
    <text x="2" y="54" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="currentColor" opacity="0.65">GHAZARA TRADING &amp; MARKETING</text>
  </g>
</svg>
